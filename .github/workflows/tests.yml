name: Pruebas full stack

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sportswear_ci_only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psportswear_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: sportswear_ci_only
      DB_NAME: sportswear_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run screenshots
      - name: Guardar reportes y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportswear-pruebas
          path: |
            playwright-report/
            test-results/
            docs/capturas/
          retention-days: 14
